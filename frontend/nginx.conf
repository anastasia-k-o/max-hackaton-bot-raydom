server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API Core Backend на том же адресе, что и мини-приложение.
    # Имя core — сервис из docker-compose.yml; resolver позволяет nginx
    # стартовать, даже если core ещё не поднялся.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core http://core:8090;
    # Инструменты /dev (перевод часов, вход за любого) наружу не отдаём:
    # через туннель этот адрес виден всему интернету. Локально они
    # доступны напрямую на порту Core Backend (:8090/dev/...).
    location /api/dev/ {
        return 404;
    }

    location /api/ {
        proxy_pass $core;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 15s;
    }

    # Собранные файлы с хешем в имени кешируются надолго.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Одностраничное приложение: любой путь, включая /app/{event_id} из
    # кнопки бота, отдаёт index.html, а дальше разбирается роутер.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
