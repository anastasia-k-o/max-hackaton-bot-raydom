# Вся система «Рядом» одной командой: make up (или docker compose up -d --build).
#
#   frontend  :4173  мини-приложение (nginx) + прокси /api → core
#   core      :8090  Core Backend: записи, очередь, напоминания (SQLite в томе)
#   bot       :8080  бот MAX: уведомления и кнопки
#
# Настройки — один файл .env рядом с этим (скопируйте из .env.example).
# Адреса сервисов друг для друга здесь заданы жёстко (http://core:8090,
# http://bot:8080): они верны только внутри сети compose, в .env их нет.

name: max-hackaton

# no-new-privileges здесь намеренно нет: на части систем (в том числе с
# Docker из snap) с этой настройкой ядро отказывает в запуске любого
# процесса в контейнере — «exec: operation not permitted». Все три сервиса
# и без неё работают от непривилегированных пользователей (кроме мастер-
# процесса nginx, который сам понижает права рабочим процессам).
x-hardening: &hardening
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  core:
    <<: *hardening
    build: ./backend
    image: max-hackaton/core:dev
    ports:
      - "${CORE_PORT:-8090}:8090"
    environment:
      HTTP_ADDR: ":8090"
      DB_PATH: /data/core.db
      DEV_MODE: ${DEV_MODE:-true}
      NOTIFY_MODE: ${NOTIFY_MODE:-http}
      BOT_BASE_URL: http://bot:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?задайте INTERNAL_API_KEY в .env (make env)}
      CORE_API_KEY: ${CORE_API_KEY:?задайте CORE_API_KEY в .env (make env)}
      MINI_APP_URL: ${MINI_APP_URL:-}
      TIMING_PRESET: ${TIMING_PRESET:-real}
      SEED_DEMO: ${SEED_DEMO:-true}
      # Тот же токен, что у бота: им подписана initData мини-приложения.
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      INITDATA_MAX_AGE: ${INITDATA_MAX_AGE:-24h}
      # При DEV_MODE вход без MAX идёт под этим аккаунтом MAX.
      DEMO_MAX_USER_ID: ${DEMO_MAX_USER_ID:-}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-}
    volumes:
      - core-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/core", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  bot:
    <<: *hardening
    build:
      context: ./bot
      args:
        VERSION: ${VERSION:-dev}
    image: max-hackaton/bot:dev
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${BOT_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_MODE: ${MAX_MODE:-mock}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      # Без публичного адреса у бота работает только polling.
      MAX_UPDATES_MODE: ${MAX_UPDATES_MODE:-polling}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_BASE_URL: ${MAX_BASE_URL:-}
      # Сертификат УЦ Минцифры: файл bot/certs/russian_trusted_root_ca.pem
      # (его кладёт bot/scripts/max-install-ca.sh) монтируется в /certs.
      # Путь из .env годится только для запуска без Docker, поэтому здесь
      # он заменяется на путь внутри контейнера, если в .env он задан.
      MAX_CA_FILE: ${MAX_CA_FILE:+/certs/russian_trusted_root_ca.pem}
      MAX_MINIAPP_BUTTON: ${MAX_MINIAPP_BUTTON:-link}
      CORE_MODE: http
      CORE_BASE_URL: http://core:8090
      CORE_API_KEY: ${CORE_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MINI_APP_URL: ${MINI_APP_URL:-}
    volumes:
      - ./bot/certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        VITE_MAX_BOT_URL: ${MAX_BOT_URL:-}
        VITE_API_URL: /api
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-false}
    image: max-hackaton/frontend:dev
    depends_on:
      - core
    ports:
      - "${FRONTEND_PORT:-4173}:80"

volumes:
  core-data:
